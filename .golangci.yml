version: "2"
run:
  modules-download-mode: vendor
  tests: false
linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by default
  # in v2 and so are not repeated here.
  enable:
    - copyloopvar
    - dogsled
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - nakedret
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    gocognit:
      # minimal code complexity to report, 30 by default (but we recommend 10-20)
      min-complexity: 20
    gocyclo:
      # minimal code complexity to report, 30 by default (but we recommend 10-20)
      min-complexity: 20
    nakedret:
      # make an issue if func has more lines of code than this setting and it has naked returns; default is 30
      max-func-lines: 30
    unparam:
      # Inspect exported functions, default is false. Set to true if no external
      # program/library imports your code.
      check-exported: false
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    # Not using the default exclusions because we want to require comments on
    # public functions and types.
    rules:
      - path: (.+)\.go$
        text: should have a package comment
      - path: (.+)\.go$
        text: package comment should be of the form
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
